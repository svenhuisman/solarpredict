services:
  solarpredict:
    build: .
    container_name: solarpredict
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Defaults so /api/ha works without query params (override per request via URL)
      SP_LAT: "52.37"
      SP_LON: "4.90"
      SP_PLANES: "30:0:5.0"          # tilt:azimuth:kWp, comma-separated for multiple planes
      SP_TZ: "Europe/Amsterdam"
      SP_RESOLUTION: "15"
      SP_DAYS: "3"
      # SP_HORIZON: "0,0,5,12,8,3,0,0"
      # SP_INVERTER_KW: "4.2"
      # SP_DAMPING_MORNING: "0.2"
      # SP_DAMPING_EVENING: "0.2"
      # SP_EFFICIENCY: "0.90"
      # SP_API_TOKEN: "change-me"   # require token on API (recommended if exposed to internet)
